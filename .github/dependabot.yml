# Minor and patch bumps are grouped into one PR per ecosystem so the queue stays short and
# contributors' PRs don't keep landing on top of a dozen dependency PRs. Major bumps still
# arrive one PR each, since they are the ones that need a real look.
version: 2
updates:
  # Hash-locked requirement files (requirements/*.txt, compiled from *.in
  # with uv; see requirements/README.md). requirements.txt pulls them in with -r.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image digests: Dockerfile (API) and frontend/Dockerfile (dashboard).
  - package-ecosystem: docker
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
