version: 2
updates:
  # Hash-locked requirement files (requirements/*.txt, compiled from *.in
  # with uv; see requirements/README.md). requirements.txt pulls them in with -r.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Base image digest in Dockerfile (both stages pin the same digest).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Wait a week before proposing a brand-new release (lets yanked or
    # compromised versions get caught upstream first).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
