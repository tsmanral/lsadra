name: ClusterFuzzLite PR fuzzing

# Fuzzes the log parsers with Atheris (fuzz/, .clusterfuzzlite/) on pull
# requests that touch them (gap G-24). Advisory: not a required check. The
# Hypothesis tests in tests/fuzz/ run in the main CI suite on every PR.
on:
  pull_request:
    paths:
      - "lsadra/ingestion/**"
      - "lsadra/endpoint_agent/**"
      - "fuzz/**"
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-fuzzing:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
