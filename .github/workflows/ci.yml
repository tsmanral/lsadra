name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the whole suite on a tag before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned lint tools (hash-checked)
        run: pip install --require-hashes -r requirements/ci-tools.txt
      - name: Ruff lint (bootstrap ruleset — see ruff.toml)
        run: ruff check .
      - name: Ruff security rules ratchet (no new S findings)
        run: python scripts/ruff_security_ratchet.py
      - name: Ruff format check (advisory)
        run: ruff format --check . || echo "::warning::formatting deferred to a dedicated PR (see ruff.toml)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Boot in dev mode so the §6 config guards (JWT secret / TLS) don't trip CI.
      LSADRA_DEV_MODE: "true"
      # Windows runners default to cp1252; force UTF-8 so the smoke test prints emoji.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-checked locks)
        # torch.txt uses the PyTorch CPU index only and installs with
        # --no-deps (its dependencies are locked in requirements/ml.txt).
        shell: bash
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes --no-deps -r requirements/torch.txt
          pip check
      - name: Smoke gate
        run: python tests/test_v4_smoke.py
      - name: Security regression gate
        shell: bash
        run: |
          if [ -d tests/security ]; then
            python -m pytest tests/security/ -q
          else
            echo "tests/security/ not present on this ref — lands with the §6 remediation PR."
          fi
      - name: Demo corpus contract gate
        shell: bash
        run: |
          if [ -f tests/test_demo_corpus.py ]; then
            python -m pytest tests/test_demo_corpus.py -q
          else
            echo "tests/test_demo_corpus.py not present on this ref."
          fi
      - name: Full backend suite
        # Everything under tests/ except the smoke script (it runs as a plain
        # script above and exits at import, so pytest must not collect it).
        run: python -m pytest tests/ --ignore=tests/test_v4_smoke.py -q

  test-newer-python:
    # README promises Python 3.12 or newer; this keeps 3.13 and 3.14 honest.
    # Separate job name so the required `test (<os>)` checks stay unchanged;
    # not a required check.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    env:
      LSADRA_DEV_MODE: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (hash-checked locks)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes --no-deps -r requirements/torch.txt
          pip check
      - name: Smoke gate
        run: python tests/test_v4_smoke.py
      - name: Security regression gate
        run: python -m pytest tests/security/ -q
      - name: Full backend suite
        run: python -m pytest tests/ --ignore=tests/test_v4_smoke.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - name: ESLint (report)
        run: npx eslint . -f json -o eslint.json || true
      - name: ESLint baseline gate (fail only if errors exceed 157)
        # Lint debt is being paid down in dedicated PRs; this gate only blocks
        # regressions above the recorded baseline (157 errors).
        run: |
          node -e '
            const r = require("./eslint.json");
            const errors = r.reduce((n, f) => n + f.errorCount, 0);
            const warnings = r.reduce((n, f) => n + f.warningCount, 0);
            console.log(`eslint: ${errors} errors, ${warnings} warnings (baseline: 157 errors)`);
            if (errors > 157) {
              console.log(`::error::eslint errors ${errors} exceed baseline 157`);
              process.exit(1);
            }
          '
