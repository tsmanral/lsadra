name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint (bootstrap ruleset — see ruff.toml)
        run: ruff check .
      - name: Ruff format check (advisory)
        run: ruff format --check . || echo "::warning::formatting deferred to a dedicated PR (see ruff.toml)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Boot in dev mode so the §6 config guards (JWT secret / TLS) don't trip CI.
      LSADRA_DEV_MODE: "true"
      # Windows runners default to cp1252; force UTF-8 so the smoke test prints emoji.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # NOTE (first-run validation): requirements.txt pins torch via the CPU
        # wheel index. If the plain install fails, the extra-index fallback runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            || pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pytest
      - name: Smoke gate
        run: python tests/test_v4_smoke.py
      - name: Security regression gate
        shell: bash
        run: |
          if [ -d tests/security ]; then
            python -m pytest tests/security/ -q
          else
            echo "tests/security/ not present on this ref — lands with the §6 remediation PR."
          fi
      - name: Demo corpus contract gate
        shell: bash
        run: |
          if [ -f tests/test_demo_corpus.py ]; then
            python -m pytest tests/test_demo_corpus.py -q
          else
            echo "tests/test_demo_corpus.py not present on this ref."
          fi
      - name: Full backend suite
        # Everything under tests/ except the smoke script (it runs as a plain
        # script above and exits at import, so pytest must not collect it).
        run: python -m pytest tests/ --ignore=tests/test_v4_smoke.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - name: ESLint (report)
        run: npx eslint . -f json -o eslint.json || true
      - name: ESLint baseline gate (fail only if errors exceed 164)
        # Lint debt is being paid down in dedicated PRs; this gate only blocks
        # regressions above the recorded baseline (164 errors / 5 warnings).
        run: |
          node -e '
            const r = require("./eslint.json");
            const errors = r.reduce((n, f) => n + f.errorCount, 0);
            const warnings = r.reduce((n, f) => n + f.warningCount, 0);
            console.log(`eslint: ${errors} errors, ${warnings} warnings (baseline: 164 errors)`);
            if (errors > 164) {
              console.log(`::error::eslint errors ${errors} exceed baseline 164`);
              process.exit(1);
            }
          '
