name: Collectors

# The Rust endpoint collectors (ADR 0001) in collectors/: format, clippy,
# unit + contract + kill-and-spool tests, and a release build on all three OSes.
# The contract test reads docs/contracts/event-schema.v1.json, so a schema edit
# runs this workflow too.
on:
  pull_request:
    paths:
      - "collectors/**"
      - "docs/contracts/event-schema.v1.json"
      - ".github/workflows/collectors.yml"
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - "docs/contracts/event-schema.v1.json"
      - ".github/workflows/collectors.yml"

permissions:
  contents: read

concurrency:
  group: collectors-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: collectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (stable, from the runner's rustup)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unit, schema contract, kill-and-spool)
        run: cargo test --workspace --locked
      - name: Release build and size
        run: |
          cargo build --release --locked -p lsadra-agent
          ls -l target/release/lsadra-agent* | grep -v '\.d$'
