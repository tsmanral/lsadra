name: DCO

# Developer Certificate of Origin: every commit in a PR must carry a
# `Signed-off-by:` trailer (git commit -s). This is a REQUIRED status check in
# branch protection as of 2026-08-06.
#
# Merge commits are skipped (--no-merges). They introduce no authored content —
# everything in them already comes from the two parents, and each parent is
# checked on its own. Including them means that clicking "Update branch" (or
# letting auto-merge update it) injects a GitHub-authored merge commit with no
# sign-off, which fails the check permanently through no fault of the
# contributor. With the branch protection now set to strict, that update is the
# normal path, so this stopped being a corner case.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed — add sign-off with 'git commit -s' (or rebase --signoff)."
            exit 1
          fi
          echo "All PR commits are signed off."
