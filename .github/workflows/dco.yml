name: DCO

# Developer Certificate of Origin: every commit in a PR must carry a
# `Signed-off-by:` trailer (git commit -s). This is a REQUIRED status check in
# branch protection as of 2026-08-06.
#
# GitHub-GENERATED merge commits are skipped — and only those. Clicking "Update
# branch", or letting auto-merge update it, injects a merge commit committed by
# `GitHub <noreply@github.com>` with no sign-off, which fails this check
# permanently through no fault of the contributor: the commit is not theirs to
# fix. With branch protection now strict, that update is the normal path to
# merge, so this is on the critical path for every PR.
#
# Contributor-authored merge commits are still checked, deliberately. A merge is
# only content-free when it is clean; resolving a conflict puts authored code in
# the merge commit and nowhere else, so blanket `--no-merges` would let that
# content bypass sign-off entirely. The committer-identity test is narrow enough
# to close the bug without opening that hole.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list "$base..$head"); do
            # Skip only GitHub's own branch-update merge commits: more than one
            # parent AND committed by GitHub itself. Everything else, including a
            # contributor's own merge commit, still requires a sign-off.
            parents=$(git rev-list --parents -n1 "$c" | wc -w)
            committer=$(git log -1 --format=%ce "$c")
            if [ "$parents" -gt 2 ] && [ "$committer" = "noreply@github.com" ]; then
              echo "skipping GitHub-generated merge commit $c"
              continue
            fi
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed — add sign-off with 'git commit -s' (or rebase --signoff)."
            exit 1
          fi
          echo "All PR commits are signed off."
