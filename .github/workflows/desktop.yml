name: Desktop app

# Builds and tests the Tauri tray app in desktop/ on all three desktop OSes,
# and the self-contained lsadra-server it ships (PyInstaller, desktop/sidecar/).
# Not a required check: it runs only when the app, the dashboard or the
# server's build inputs change (and on main for any server change, since the
# installers carry the server).
on:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "requirements/base.txt"
      - "requirements/sidecar.txt"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "lsadra/**"
      - "pyproject.toml"
      - "requirements/base.txt"
      - "requirements/sidecar.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Linux webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (preinstalled rustup, no third-party action)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the bundled server (PyInstaller, hash-locked inputs)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/base.txt -r requirements/sidecar.txt
          cd desktop/sidecar
          pyinstaller --noconfirm --clean --distpath ../src-tauri/sidecar lsadra-server.spec
      - name: Self-test the bundled server
        # A module or data file PyInstaller missed only fails at run time.
        shell: bash
        working-directory: desktop/src-tauri/sidecar/lsadra-server
        run: ./lsadra-server --self-test
      - name: Build the dashboard the app ships
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Installers (unsigned)
        if: github.event_name != 'pull_request'
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.sidecar.conf.json
      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsadra-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn
          retention-days: 14
