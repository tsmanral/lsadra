name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the docs toolchain (hash-checked)
        run: pip install --require-hashes -r requirements/docs.txt
      - name: Build the docs site in strict mode
        # Strict mode fails on broken links, missing anchors and pages left
        # out of the nav (see the validation block in mkdocs.yml).
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
