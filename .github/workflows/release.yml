name: Release

on:
  # A v* tag pushed by a person, or the tag release-please creates when its
  # release PR merges (release-please.yml dispatches this workflow on it).
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# One release per tag at a time; never cancel a publish half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full CI suite (lint, tests on Ubuntu/Windows/macOS, frontend build)
  # must pass on the tagged commit before anything is published.
  verify:
    name: Verify (full CI)
    # A manual dispatch from a branch publishes nothing: only a v* tag releases.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  docker-image:
    name: Publish signed Docker image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers and a v* tag rule
    # in Settings > Environments > release.
    environment: release
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing + provenance (Sigstore OIDC)
      attestations: write  # GitHub artifact attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      # Fixed image name so the package survives the repo rename to LSADRA
      IMAGE: ghcr.io/${{ github.repository_owner }}/lsadra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit (docker-container driver) is needed for SBOM + provenance.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=LSADRA
            org.opencontainers.image.description=LSADRA - Local Security Anomaly Detection & Risk Assessment
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push (with SBOM and SLSA provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance (GitHub attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  github-release:
    name: Publish GitHub Release
    needs: docker-image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # create, edit and publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notes: the hand-written docs/releases/<tag>.md when present, otherwise
      # the release-please changelog (or GitHub's generated notes for a tag
      # pushed by hand). The image verification block is always appended.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ needs.docker-image.outputs.digest }}
        run: python3 scripts/release_notes.py --tag "$TAG" --owner "$OWNER" --digest "$DIGEST" --out notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # release-please made a draft when its PR merged: fill and publish it.
            if [ -f "docs/releases/${TAG}.md" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest
            else
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > changelog.md
              cat notes.md >> changelog.md
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file changelog.md --draft=false --latest
            fi
          elif [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --notes-file notes.md
          fi
