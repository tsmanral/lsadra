# LSADRA endpoint collectors (ADR 0001): small, static Rust agents that read the
# host's security logs and ship event-schema v1 events (ADR 0006) to the core.
[workspace]
resolver = "2"
members = ["core", "source-journald", "source-wineventlog", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/tsmanral/lsadra"
publish = false

[workspace.dependencies]
lsadra-collector-core = { path = "core", default-features = false }
lsadra-source-journald = { path = "source-journald" }
lsadra-source-wineventlog = { path = "source-wineventlog" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex-lite = "0.1"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
keyring = { version = "3.6", default-features = false }
roxmltree = "0.21"
windows-sys = "0.61"
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Light binaries: size-optimised, LTO, no unwinding tables, symbols stripped.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
