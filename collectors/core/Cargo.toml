[package]
name = "lsadra-collector-core"
description = "Shared collector core: event-schema v1 events, disk spool, shipper, device-key storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex-lite.workspace = true
toml.workspace = true
ureq = { workspace = true, optional = true }

[features]
# The HTTPS shipper. Source crates build without it, so they stay free of TLS.
default = ["http"]
http = ["dep:ureq"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { workspace = true, features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
