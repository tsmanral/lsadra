[package]
name = "lsadra-desktop"
version = "0.1.0"
description = "LSADRA desktop tray app: runs the local LSADRA server and shows the dashboard"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "lsadra_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# Stop the server when the app is terminated (logout, shutdown, Ctrl-C).
signal-hook = "0.3"

[profile.release]
# Small binary: the tray app should stay lightweight.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
