# LSADRA V3 — Docker Compose
# Production configuration with API, Dashboard, and Agent Simulator services.

version: "3.9"

services:
  # ── API Server ──────────────────────────────────────────────────────────
  api:
    build: .
    container_name: lsadra-api
    ports:
      # Published on the host's loopback only (G-8). To reach the API from other
      # machines, put a TLS proxy in front, or set LSADRA_TLS_CERT/KEY and drop
      # LSADRA_ALLOW_PLAINTEXT_LISTENER below.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # Inside the container the API must listen on all interfaces for the
      # published port to reach it; that port is loopback-only on the host.
      - LSADRA_API_HOST=0.0.0.0
      - LSADRA_API_PORT=8000
      - LSADRA_ALLOW_PLAINTEXT_LISTENER=${LSADRA_ALLOW_PLAINTEXT_LISTENER:-true}
      - LSADRA_REQUIRE_TLS=${LSADRA_REQUIRE_TLS:-false}
      - LSADRA_JWT_SECRET=${LSADRA_JWT_SECRET:?LSADRA_JWT_SECRET must be set — see .env.example}
      - LSADRA_ALLOW_SIGNUP=${LSADRA_ALLOW_SIGNUP:-false}
      - LSADRA_ABUSEIPDB_API_KEY=${LSADRA_ABUSEIPDB_API_KEY:-}
      - LSADRA_MIN_BASELINE_EVENTS=${LSADRA_MIN_BASELINE_EVENTS:-200}
      - LSADRA_RETENTION_DAYS=${LSADRA_RETENTION_DAYS:-30}
      - LSADRA_ALERT_RETENTION_DAYS=${LSADRA_ALERT_RETENTION_DAYS:-365}
      # The React dashboard (web service) calls the API from the browser.
      - LSADRA_CORS_ORIGINS=${LSADRA_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - sentinel-data:/app/data
      - sentinel-logs:/app/logs
    healthcheck:
      # The image has no curl; probe with Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── React Dashboard ─────────────────────────────────────────────────────
  # Static build of frontend/ served by unprivileged nginx. The browser talks
  # to the API at http://localhost:8000, so open the dashboard on the same
  # machine; serving it to other hosts needs a configurable API address.
  # Published on the host's loopback only (G-7).
  web:
    build:
      context: ./frontend
      args:
        # Where the browser reaches the API; empty means http://localhost:8000.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: lsadra-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Agent Simulator ────────────────────────────────────────────────────
  agent-sim:
    build: .
    container_name: lsadra-agent-sim
    command: >
      python -c "
      import time, requests, sys;
      time.sleep(5);
      print('Agent sim ready — waiting for manual trigger.');
      while True: time.sleep(3600)
      "
    environment:
      - SERVER_URL=http://api:8000
    healthcheck:
      disable: true  # idle helper; the image's API health check does not apply
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sentinel-data:
    driver: local
  sentinel-logs:
    driver: local
