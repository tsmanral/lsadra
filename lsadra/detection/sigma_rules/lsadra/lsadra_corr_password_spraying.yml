title: Password Spraying From One Source
name: lsadra_corr_password_spraying
id: c8bc823b-04aa-5dde-8524-8d2454c12d9d
status: test
description: Failed logons against five or more distinct accounts from one source address within ten minutes (Sigma 2.0 value_count correlation).
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: LSADRA contributors
date: 2026-11-18
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - lsadra_auth_failure
    group-by:
        - SourceIp
    timespan: 10m
    condition:
        field: TargetUserName
        gte: 5
falsepositives:
    - A NAT address shared by many users
level: high
