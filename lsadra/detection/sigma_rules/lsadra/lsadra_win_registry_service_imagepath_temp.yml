title: Service ImagePath Set To A Temp Folder
name: lsadra_win_registry_service_imagepath_temp
id: b71e5883-9a96-52b1-80cd-763ec7c51c18
status: test
description: Detects a registry write that points a service's ImagePath at a Windows or user temp folder.
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: LSADRA contributors
date: 2026-11-18
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\CurrentControlSet\Services\'
        TargetObject|endswith: '\ImagePath'
        Details|contains:
            - '\Windows\Temp\'
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
    condition: selection
falsepositives:
    - Installers that run a service from their extraction folder
level: high
